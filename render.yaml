services:
  - type: web
    name: valid-video
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /videos
    # Deploys are triggered only by the GitHub Actions workflow after tests
    # pass (see .github/workflows/ci.yml), not automatically on every push --
    # otherwise a failing-tests push would still go live.
    autoDeploy: false
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
